name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: pg_atlas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d pg_atlas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format (ruff format --check)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy pg_atlas/

      - name: Run migrations
        run: uv run alembic upgrade heads
        env:
          PG_ATLAS_DATABASE_URL: postgresql://atlas:atlas@localhost:5432/pg_atlas_test

      # Both database variables are set, so the DB integration tests run here
      # rather than skip; an unreachable database fails the job loudly.
      - name: Test (pytest)
        run: uv run pytest
        env:
          PG_ATLAS_API_URL: "https://test.pg-atlas.example"
          PG_ATLAS_DATABASE_URL: postgresql://atlas:atlas@localhost:5432/pg_atlas_test
          PG_ATLAS_TEST_DATABASE_URL: postgresql://atlas:atlas@localhost:5432/pg_atlas_test

  sbom:
    name: Submit SBOM
    runs-on: ubuntu-latest
    # Only submit on pushes to main — not on PRs, where no deployed API is
    # available and the SBOM would reflect an unmerged branch.
    if: github.event_name == 'push'
    permissions:
      contents: read # for GitHub Dependency Graph API
      id-token: write # for GitHub OIDC token (authenticates to PG Atlas)

    steps:
      - uses: SCF-Public-Goods-Maintenance/pg-atlas-sbom-action@main
