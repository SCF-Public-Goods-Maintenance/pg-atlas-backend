[project]
name = "pg-atlas-backend"
version = "0.8.0"
description = "PG Atlas backend: ingestion pipeline, storage, metric computation, and REST API."
authors = [{ name = "Alex Olieman", email = "alex@olieman.net" }]
license = { text = "MPL-2.0" }
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.161.1",
    "uvicorn[standard]>=0.54.0",
    "pydantic-settings>=2.16.1",
    "sqlalchemy[asyncio]>=2.1.6",
    "asyncpg>=0.32.0",
    "alembic>=1.20.1",
    "spdx-tools>=0.8.5",
    "pyjwt[crypto]>=2.15.1",
    "cryptography>=50.0.2",
    "aiobotocore>=3.10.0",
    "cachetools>=7.2.4",
    "procrastinate>=3.10.0",
    "psycopg[binary,pool]>=3.3.6",
    "pygithub>=2.10.0",
    "betterproto2[all]>=0.10.0",
    "networkx>=3.7",
    "numpy>=2.5.4",
    "msgspec>=0.22.0",
    "pyrate-limiter>=4.5.1",
    "pypistats>=1.14.0",
    "packaging>=26.3",
    "freezegun>=1.5.5",
    "httpx2>=2.16.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-mock",
    "ruff>=0.17.2",
    "mypy",
    "types-cachetools",
    "pytest-cov>=7.1.0",
    "types-pyyaml>=6.0.12.20260906",
    "types-networkx>=3.6.1.20261021",
    "types-aiobotocore-custom",
    "basedpyright>=1.40.2",
    "mistletoe>=1.6.0",
    "ruamel-yaml>=0.19.1",
]
proto-build = [
    "betterproto2-compiler>=0.10.1",
    "grpcio-tools",
]

[tool.uv]
conflicts = [
    [
        { group = "dev" },
        { group = "proto-build" },
    ],
]

[tool.uv.sources]
types-aiobotocore-custom = { path = "vendored/types_aiobotocore_custom-3.10.0-py3-none-any.whl" }

[project.scripts]
pg-atlas = "pg_atlas.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pg_atlas"]

[tool.pytest]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "flaky: tests that can randomly fail through no change to the code",
    "slow: tests that decompress large fixtures",
]

[tool.black]
line-length = 127

[tool.ruff]
line-length = 127
exclude = ["pg_atlas/deps_dev/lib"]

[tool.ruff.lint]
select = ["E", "F", "I"]
per-file-ignores = { "pg_atlas/procrastinate/versions/*.py" = ["E501"] }

[tool.mypy]
python_version = "3.14"
explicit_package_bases = true
disallow_untyped_defs = true
ignore_missing_imports = true
warn_return_any = true
warn_unused_ignores = true
exclude = "pg_atlas/deps_dev/lib/"

[[tool.mypy.overrides]]
module = ["pg_atlas.deps_dev.lib.*"]
ignore_errors = true
